model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
personality = "pragmatic"

[sandbox_workspace_write]
network_access = true

[features]
unified_exec = true
steer = true
multi_agent = true
apps = true
prevent_idle_sleep = true
terminal_resize_reflow = true
memories = true
goals = true
js_repl = false
chronicle = true

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

[plugins."gmail@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."control-tower-dev@control-tower-plugins"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[tui.model_availability_nux]
"gpt-5.5" = 4

[desktop]
git-commit-instructions = "Follow codebase commit standard."
git-pr-instructions = "Be relatively concise / conscious of people's time to read. Be detailed when there's relevant details, less so when there's less."
followUpQueueMode = "steer"
dock-icon-preference = "app-default"
keepRemoteControlAwakeWhilePluggedIn = true
conversationDetailMode = "STEPS_PROSE"
defaultTerminalLocation = "right"
preventSleepWhileRunning = true
show-context-window-usage = true
notifications-turn-mode = "always"
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
selected-avatar-id = "custom:vigil"
avatar-overlay-mascot-width-px = 191
open-link-in-target-preference = "in-app-browser"
git-pull-request-merge-method = "squash"
reviewDelivery = "detached"
worktree-keep-count = 50

[desktop.open-in-target-preferences]
global = "terminal"
